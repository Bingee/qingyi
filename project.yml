name: LightTranslator
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LightTranslator:
    type: application
    platform: macOS
    sources:
      - path: LightTranslator
    info:
      path: LightTranslator/Info.plist
      properties:
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_NAME: "轻译"
        PRODUCT_BUNDLE_IDENTIFIER: com.local.light-translator
        INFOPLIST_FILE: LightTranslator/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets: []
